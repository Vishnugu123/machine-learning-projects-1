<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Student Performance Predictor</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 30px;
    }

    .container {
        width: 100%;
        max-width: 700px;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
        color: #333;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 30px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
    }

    label {
        margin-bottom: 7px;
        font-weight: 600;
        color: #444;
    }

    input,
    select {
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: #4CAF50;
    }

    .full-width {
        grid-column: span 2;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 14px;
        border: none;
        background: #4CAF50;
        color: white;
        font-size: 16px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
    }

    button:hover {
        background: #45a049;
    }

    .result {
        margin-top: 25px;
        padding: 20px;
        text-align: center;
        background: #e8f5e9;
        border-radius: 8px;
    }

    .result h2 {
        color: #2e7d32;
    }

    @media (max-width: 600px) {
        .form-grid {
            grid-template-columns: 1fr;
        }

        .full-width {
            grid-column: span 1;
        }
    }
</style>
```

</head>

<body>

<div class="container">

```
<h1>Student Performance Predictor</h1>

<p class="subtitle">
    Enter student details to predict the Maths Score
</p>

<form action="{{ url_for('predict_datapoint') }}" method="POST">

    <div class="form-grid">

        <!-- Gender -->
        <div class="form-group">
            <label>Gender</label>
            <select name="gender" required>
                <option value="">Select Gender</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
            </select>
        </div>


        <!-- Race Ethnicity -->
        <div class="form-group">
            <label>Race / Ethnicity</label>
            <select name="race_ethnicity" required>
                <option value="">Select Group</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>
        </div>


        <!-- Parent Education -->
        <div class="form-group full-width">
            <label>Parental Level of Education</label>

            <select name="parental_level_of_education" required>
                <option value="">Select Education</option>
                <option value="some high school">Some High School</option>
                <option value="high school">High School</option>
                <option value="some college">Some College</option>
                <option value="associate's degree">Associate's Degree</option>
                <option value="bachelor's degree">Bachelor's Degree</option>
                <option value="master's degree">Master's Degree</option>
            </select>
        </div>


        <!-- Lunch -->
        <div class="form-group">
            <label>Lunch</label>

            <select name="lunch" required>
                <option value="">Select Lunch Type</option>
                <option value="standard">Standard</option>
                <option value="free/reduced">Free/Reduced</option>
            </select>
        </div>


        <!-- Test Preparation -->
        <div class="form-group">
            <label>Test Preparation Course</label>

            <select name="test_preparation" required>
                <option value="">Select Option</option>
                <option value="none">None</option>
                <option value="completed">Completed</option>
            </select>
        </div>


        <!-- Reading Score -->
        <div class="form-group">
            <label>Reading Score (0-100)</label>

            <input
                type="number"
                name="reading_score"
                min="0"
                max="100"
                placeholder="Enter reading score"
                required
            >
        </div>


        <!-- Writing Score -->
        <div class="form-group">
            <label>Writing Score (0-100)</label>

            <input
                type="number"
                name="writing_score"
                min="0"
                max="100"
                placeholder="Enter writing score"
                required
            >
        </div>

    </div>


    <button type="submit">
        Predict Maths Score
    </button>

</form>


{% if result is not none %}
<div class="result">
    <h2>
        Predicted Maths Score: {{ result }}
    </h2>
</div>
{% endif %}
```

</div>

</body>
</html>
